name: Build and Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Sonoff firmware and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve version
        id: version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          VERSION="v$(date -u +%Y.%m.%d)-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "asset=opensprinkler-sonoff-4ch-pro-r3-${VERSION}.bin" >> "$GITHUB_OUTPUT"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install html-minifier-terser
        run: npm install html-minifier-terser

      - name: Build firmware
        run: pio run -e sonoff_4ch_pro_r3

      - name: Prepare release asset
        run: |
          cp .pio/build/sonoff_4ch_pro_r3/firmware.bin \
            "${{ steps.version.outputs.asset }}"
          ls -lh "${{ steps.version.outputs.asset }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: OpenSprinkler Sonoff 4CH Pro R3 ${{ steps.version.outputs.version }}
          body: |
            Firmware build for **Sonoff 4CH Pro R3** (`sonoff_4ch_pro_r3`).

            Built from commit `${{ github.sha }}` on `master`.

            ### Flash
            1. Hold physical Button 1 (GPIO0) while powering the board to enter flash mode.
            2. Flash with esptool, PlatformIO, or your preferred ESP8266 flasher at 115200 baud / 3.3 V.

            ```bash
            pio run -e sonoff_4ch_pro_r3 --target upload
            ```

            See the [README](../blob/master/README.md) for wiring and usage notes.
          files: ${{ steps.version.outputs.asset }}
          generate_release_notes: true
          draft: false
          make_latest: true
